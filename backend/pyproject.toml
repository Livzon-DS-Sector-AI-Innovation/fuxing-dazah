[project]
name = "dazah-backend"
version = "0.1.0"
description = "原料药事业部工厂系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2",
    "pg8000>=1.31.5",
    "lark-oapi>=1.6.8",
    "mammoth>=1.6.0",
    "pyjwt[crypto]>=2.10.0",
    "tqdm>=4.68.1",
    "openai>=2.41.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "fpdf2>=2.8.0",
    "weasyprint>=63.0",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
    "croniter>=6.2.2",
    "pdfplumber>=0.11.0",
    "xlrd>=2.0.0",
    "fastmcp>=3.4.2",
    "minio>=7.2.0",
    "graphon>=0.5.3,<0.6",
    # ── 以下 4 项随 safety 模块合并自 dazah-backend，原仓库未声明（仅装在 venv 里）──
    "pydantic-ai>=2.8.0",   # business_agent 智能体框架
    "PyMuPDF>=1.28.0",      # knowledge 模块 PDF 解析（import fitz）
    "playwright>=1.61.0",   # regulation_crawler 法规爬取
    "markitdown>=0.1.6",    # knowledge 文档转换
    # ── safety 模块直连但此前靠传递依赖存活的 3 项 ──
    "numpy>=1.26.0",        # knowledge/bm25 向量计算
    "websockets>=12.0",     # feishu/event_client 飞书长连接
    "beautifulsoup4>=4.12.0",  # regulation_crawler HTML 解析
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# 归档迁移目录是旧仓库迁移文件快照（不再执行），排除出 lint 范围
extend-exclude = ["app/modules/safety/migrations/_archive_from_dazah_backend", "app/modules/safety.bak.*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
reportOptionalMemberAccess = "none"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "lark_oapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mammoth", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
    "types-openpyxl>=3.1.5",
]
